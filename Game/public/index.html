<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pico Park</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #222;
        color: #fff;
        font-family: sans-serif;
      }

      /* Contenedor del QR fijado arriba a la derecha */
      #contenedor-qr {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #ipTexto {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: bold;
      }

      #qr {
        border: 2px solid #fff;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1 style="margin-top: 10px; font-size: 24px">Pico Park</h1>

    <div id="juego" style="margin-top: 10px"></div>

    <!-- Módulo del QR ubicado arriba a la derecha -->
    <div id="contenedor-qr">
      <p id="ipTexto"></p>
      <canvas id="qr"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="game.js"></script>

    <script>
      fetch("/ip")
        .then((r) => r.json())
        .then((data) => {
          const url = `http://${data.ip}:3000`;
          const texto = `${data.ip}:3000`;

          document.getElementById("ipTexto").innerText = texto;
          // Tamaño reducido a 100px para que ocupe menos espacio arriba
          QRCode.toCanvas(document.getElementById("qr"), url, { width: 100 });
        });
    </script>
  </body>
</html>
