name: CI-CD Pico Park Server

on:
  push:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  # Esto toma automáticamente tu usuario y el nombre del repositorio (ej. ghcr.io/thomasteagua123/pico-park-server)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (tags y etiquetas) para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.head_ref || 'main') }}
            type=sha,format=short

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./Game
          file: ./Game/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}