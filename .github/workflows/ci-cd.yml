name: CI-CD Pico Park Server

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pico-park-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Game/package-lock.json

      - name: Instalar dependencias y verificar el build
        working-directory: ./Game
        run: npm install

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata para la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build y push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: ./Game
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Guardar la imagen actual como respaldo (para rollback)
        run: |
          docker tag ghcr.io/thomasteagua123/pico-park-server:latest ghcr.io/thomasteagua123/pico-park-server:previo || true

      - name: Descargar la nueva imagen
        run: |
          cd /opt/docker/pico-park-ThomasAvila
          docker compose pull

      - name: Levantar el contenedor actualizado
        run: |
          cd /opt/docker/pico-park-ThomasAvila
          docker compose up -d

      - name: Verificar que el servicio responde
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:3010/; then
              echo "Servicio OK"
              exit 0
            fi
            echo "Intento $i falló, reintentando..."
            sleep 5
          done
          echo "El servicio no respondió tras el despliegue"
          exit 1

      - name: Rollback si la verificación falló
        if: failure()
        run: |
          cd /opt/docker/pico-park-ThomasAvila
          docker tag ghcr.io/thomasteagua123/pico-park-server:previo ghcr.io/thomasteagua123/pico-park-server:latest
          docker compose up -d
          echo "Rollback aplicado a la versión anterior"