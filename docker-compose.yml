version: '3.8'

services:
  pico-server:
    build:
      context: ./Game
      dockerfile: Dockerfile
    container_name: pico-park-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    # Si tu juego guardase datos o partidas, aquí agregarías volumes:
    # - ./Game/data:/app/data